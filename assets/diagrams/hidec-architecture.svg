<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" role="img" aria-label="Lab users use a React frontend that calls a FastAPI backend backed by MySQL, all containerized with Docker">
<style>
.box{fill:#fffcf8;stroke:#d9c7b6;stroke-width:1.5}
.box.accent{fill:#ffedd5;stroke:#c2410c}
.box.warn{fill:#fdeeec;stroke:#b42318}
.t{font:600 14px 'DM Sans',system-ui,-apple-system,sans-serif;fill:#2b2019}
.s{font:400 12px 'DM Sans',system-ui,-apple-system,sans-serif;fill:#6e5d51}
.s.warn{fill:#b42318}
.edge{stroke:#b08d74;stroke-width:1.5;fill:none}
.ah{fill:#b08d74}
.grp{fill:none;stroke:#cdb39c;stroke-width:1.2;stroke-dasharray:5 4}
.gl{font:600 10.5px ui-monospace,'SF Mono',Menlo,monospace;fill:#c2410c;letter-spacing:.06em}
.h{font:700 12px ui-monospace,'SF Mono',Menlo,monospace;fill:#c2410c;letter-spacing:.08em}
@media (prefers-color-scheme: dark){
 .box{fill:#221a14;stroke:#4a3a2e}
 .box.accent{fill:#43260f;stroke:#fb923c}
 .box.warn{fill:#3d1a16;stroke:#f97066}
 .t{fill:#f6ede4} .s{fill:#bba898} .s.warn{fill:#f97066}
 .edge{stroke:#8a7262} .ah{fill:#8a7262}
 .grp{stroke:#5a4738} .gl,.h{fill:#fb923c}
}
</style><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect class="grp" x="20" y="112" width="360" height="284" rx="12"/><rect class="box" x="20.0" y="20" width="360.0" height="58" rx="10"/><text class="t" x="200.0" y="45" text-anchor="middle">Lab users</text><text class="s" x="200.0" y="64" text-anchor="middle">students &amp; staff</text><rect class="box" x="32.0" y="142" width="336.0" height="58" rx="10"/><text class="t" x="200.0" y="167" text-anchor="middle">React frontend</text><text class="s" x="200.0" y="186" text-anchor="middle">Vite · React Router</text><rect class="box accent" x="32.0" y="234" width="336.0" height="58" rx="10"/><text class="t" x="200.0" y="259" text-anchor="middle">FastAPI backend</text><text class="s" x="200.0" y="278" text-anchor="middle">billing · authentication</text><rect class="box accent" x="32.0" y="326" width="336.0" height="58" rx="10"/><text class="t" x="200.0" y="351" text-anchor="middle">MySQL</text><text class="s" x="200.0" y="370" text-anchor="middle">my schema · Alembic</text><text class="gl" x="32" y="131">DOCKER · CI ON AZURE PIPELINES</text><line class="edge" x1="200.0" y1="80.0" x2="200.0" y2="139.0" marker-end="url(#ah)"/><line class="edge" x1="200.0" y1="202.0" x2="200.0" y2="231.0" marker-end="url(#ah)"/><line class="edge" x1="200.0" y1="294.0" x2="200.0" y2="323.0" marker-end="url(#ah)"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" role="img" aria-label="A Pytest suite queries the legacy and GraphQL APIs, compares fields and benchmarks speed, producing findings">
<style>
.box{fill:#fffcf8;stroke:#d9c7b6;stroke-width:1.5}
.box.accent{fill:#ffedd5;stroke:#c2410c}
.box.warn{fill:#fdeeec;stroke:#b42318}
.t{font:600 14px 'DM Sans',system-ui,-apple-system,sans-serif;fill:#2b2019}
.s{font:400 12px 'DM Sans',system-ui,-apple-system,sans-serif;fill:#6e5d51}
.s.warn{fill:#b42318}
.edge{stroke:#b08d74;stroke-width:1.5;fill:none}
.ah{fill:#b08d74}
.grp{fill:none;stroke:#cdb39c;stroke-width:1.2;stroke-dasharray:5 4}
.gl{font:600 10.5px ui-monospace,'SF Mono',Menlo,monospace;fill:#c2410c;letter-spacing:.06em}
.h{font:700 12px ui-monospace,'SF Mono',Menlo,monospace;fill:#c2410c;letter-spacing:.08em}
@media (prefers-color-scheme: dark){
 .box{fill:#221a14;stroke:#4a3a2e}
 .box.accent{fill:#43260f;stroke:#fb923c}
 .box.warn{fill:#3d1a16;stroke:#f97066}
 .t{fill:#f6ede4} .s{fill:#bba898} .s.warn{fill:#f97066}
 .edge{stroke:#8a7262} .ah{fill:#8a7262}
 .grp{stroke:#5a4738} .gl,.h{fill:#fb923c}
}
</style><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect class="box accent" x="20.0" y="20" width="360.0" height="58" rx="10"/><text class="t" x="200.0" y="45" text-anchor="middle">Pytest test suite</text><text class="s" x="200.0" y="64" text-anchor="middle">same member queries to both</text><rect class="box" x="20.0" y="112" width="173.0" height="58" rx="10"/><text class="t" x="106.5" y="137" text-anchor="middle">Legacy API</text><text class="s" x="106.5" y="156" text-anchor="middle">REST · all fields</text><rect class="box" x="207.0" y="112" width="173.0" height="58" rx="10"/><text class="t" x="293.5" y="137" text-anchor="middle">GraphQL API</text><text class="s" x="293.5" y="156" text-anchor="middle">fields on request</text><rect class="box" x="20.0" y="204" width="173.0" height="58" rx="10"/><text class="t" x="106.5" y="229" text-anchor="middle">Compare</text><text class="s" x="106.5" y="248" text-anchor="middle">~100 data points</text><rect class="box" x="207.0" y="204" width="173.0" height="58" rx="10"/><text class="t" x="293.5" y="229" text-anchor="middle">Benchmark</text><text class="s" x="293.5" y="248" text-anchor="middle">fetch speed</text><rect class="box accent" x="20.0" y="296" width="360.0" height="58" rx="10"/><text class="t" x="200.0" y="321" text-anchor="middle">Findings</text><text class="s" x="200.0" y="340" text-anchor="middle">gaps → updated API version</text><line class="edge" x1="200.0" y1="80.0" x2="106.5" y2="109.0" marker-end="url(#ah)"/><line class="edge" x1="200.0" y1="80.0" x2="293.5" y2="109.0" marker-end="url(#ah)"/><line class="edge" x1="106.5" y1="172.0" x2="106.5" y2="201.0" marker-end="url(#ah)"/><line class="edge" x1="106.5" y1="172.0" x2="293.5" y2="201.0" marker-end="url(#ah)"/><line class="edge" x1="293.5" y1="172.0" x2="106.5" y2="201.0" marker-end="url(#ah)"/><line class="edge" x1="293.5" y1="172.0" x2="293.5" y2="201.0" marker-end="url(#ah)"/><line class="edge" x1="106.5" y1="264.0" x2="200.0" y2="293.0" marker-end="url(#ah)"/><line class="edge" x1="293.5" y1="264.0" x2="200.0" y2="293.0" marker-end="url(#ah)"/></svg>
